<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cascading stylesheet</title>
    <!-- CSS embedded (embutido)-->
<style>
p{
    font-size: 200px;
}

#gato{
  color: crimson;
}

#cachorro{
   color: blue
}
</style>
</head>
<body>
    <!--CSS inline é aqieçe que vai dentro da própria tag--> 
    <p style="color: rgb(212, 0, 255);font-size: 200px ;">Lucas</p>
    <p id="cachorro" >  luna e nina </p>
    <p id="gato">mika </p> </p>
</body>
</html>
