<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sou gordo ou magro, depende, coma menos.</title>
</head>

<body>
    <script>
        let altura = prompt("sua altura")
        let peso = prompt("seu peso")
        let imc = peso / (altura * altura)

        if (imc < 18.5) {
            alert("abaixo do peso")
        } else if (imc >= 18.5 && imc <= 24.9) {
            alert("peso normal")
        } else if (imc >= 25.0 && imc <= 29.9) {
            alert("excesso de peso")
        } else if (imc >= 30 && imc <= 34.9) {
            alert("obesidade nivel 1")
        } else if (imc >= 35 && imc <= 39.9) {
            alert("obesidade nivel 2")
        } else if (imc >= 40) {
            alert("obesidade nivel 3")
        }

    </script>

</body>

</html>
